<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ShopNova - E-Commerce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <header class="container mt-3">

        <nav class="navbar navbar-expand-lg bg-body-tertiary rounded-3 shadow">

            <div class="container-fluid">

                <a class="navbar-brand fw-bold" href="#">
                    ShopNova
                </a>

                <button class="navbar-toggler" 
                    type="button" 
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                        <li class="nav-item">

                            <a class="nav-link active" href="#">
                                Home
                            </a>

                        </li>

                        <li class="nav-item me-2">

                            <button class="btn btn-info" onclick="showCartModel()">
                                Cart
                            </button>

                        </li>

                        <li class="nav-item">

                            <button class="btn btn-info" onclick="productAdded()">
                                Product Added
                            </button>

                        </li>

                    </ul>

                    <form class="d-flex" role="search">

                        <input 
                            class="form-control me-2" 
                            type="search" 
                            placeholder="Search">

                        <button class="btn btn-outline-success" type="submit">
                            Search
                        </button>

                    </form>

                </div>

            </div>

        </nav>

    </header>



    <main>

        <div class="container mt-5">

            <div class="row" id="product-list"></div>

        </div>


        <!-- Cart Modal -->

        <div class="modal fade" id="cartmodal" tabindex="-1">

            <div class="modal-dialog modal-xl">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Cart List
                        </h5>

                        <button 
                            type="button" 
                            class="btn-close" 
                            data-bs-dismiss="modal">
                        </button>

                    </div>


                    <div class="modal-body">

                        <div class="table-responsive">

                            <table class="table table-striped align-middle">

                                <thead>

                                    <tr>

                                        <th>Id</th>

                                        <th>Image</th>

                                        <th>Name</th>

                                        <th>Price</th>

                                        <th>Qty</th>

                                        <th>Action</th>

                                    </tr>

                                </thead>

                                <tbody id="carttable">

                                </tbody>

                            </table>

                        </div>

                    </div>


                    <div class="modal-footer justify-content-between">

                        <h5>
                            Total:
                            <span id="total">₹0.00</span>
                        </h5>

                        <div>

                            <button 
                                type="button" 
                                class="btn btn-secondary" 
                                data-bs-dismiss="modal">

                                Close

                            </button>

                            <button 
                                type="button" 
                                class="btn btn-primary" 
                                onclick="checkout()">

                                Check Out

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <div class="modal fade" id="formModal" tabindex="-1">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Add Product
                        </h5>

                        <button 
                            type="button" 
                            class="btn-close" 
                            data-bs-dismiss="modal">
                        </button>

                    </div>


                    <form id="FromTable">

                        <div class="modal-body">

                            <div class="form-floating mb-3">

                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="productName"
                                    required>

                                <label>
                                    Product Name
                                </label>

                            </div>


                            <div class="form-floating mb-3">

                                <input 
                                    type="number" 
                                    class="form-control" 
                                    id="productPrice"
                                    required>

                                <label>
                                    Product Price
                                </label>

                            </div>


                            <div class="form-floating">

                                <input 
                                    type="url" 
                                    class="form-control" 
                                    id="productImage"
                                    required>

                                <label>
                                    Product Image URL
                                </label>

                            </div>

                        </div>


                        <div class="modal-footer">

                            <button 
                                type="button" 
                                class="btn btn-secondary" 
                                data-bs-dismiss="modal">

                                Close

                            </button>

                            <button 
                                type="submit" 
                                class="btn btn-primary">

                                Product Added

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>



        <div class="modal fade" id="UpdateCartModal" tabindex="-1">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Edit Product
                        </h5>

                        <button 
                            type="button" 
                            class="btn-close" 
                            data-bs-dismiss="modal">
                        </button>

                    </div>


                    <form id="UpdateModal">

                        <div class="modal-body">

                            <div class="form-floating mb-3">

                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="updataProductName"
                                    required>

                                <label>
                                    Product Name
                                </label>

                            </div>


                            <div class="form-floating mb-3">

                                <input 
                                    type="number" 
                                    class="form-control" 
                                    id="updataProductPrice"
                                    required>

                                <label>
                                    Product Price
                                </label>

                            </div>


                            <div class="form-floating">

                                <input 
                                    type="url" 
                                    class="form-control" 
                                    id="updataProductImage"
                                    required>

                                <label>
                                    Product Image URL
                                </label>

                            </div>

                        </div>


                        <div class="modal-footer">

                            <button 
                                type="button" 
                                class="btn btn-secondary" 
                                data-bs-dismiss="modal">

                                Close

                            </button>

                            <button 
                                type="submit" 
                                class="btn btn-primary">

                                Update Product

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>



    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <script src="script.js"></script>

</body>

</html>
