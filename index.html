  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>E-Commerce</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
      <header class="container mt-3">
          <nav class="navbar navbar-expand-lg bg-body-tertiary rounded-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">ShopNova</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
 
            <button class="btn btn-info" onclick="showCartModel()">Cart</button>
            <button class="btn btn-info" onclick="productAdded()">Product Added</button>
          </li>
        
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>
      </header>

      <main>
          <div class="container">

              <div class="row" id="product-list"></div>
          </div>

      <div class="modal" id="cartmodal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Cart List</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

          <table class="table table-striped">

            <thead>
              <tr>
                <th>Id</th>
                <th>image</th>
                <th>Name</th>
                <th>Price</th>
                <th>Qty</th>
                <th colspan="4">Action</th>
              </tr>
            </thead>

            <tbody id="carttable">

            </tbody>
          </table>

        </div>
        <div class="modal-footer justify-content-between">
          <h5><span id="total"></span></h5>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" onclick="checkout()">check out</button>
        </div>
      </div>
    </div>
  </div>


  <div class="modal" id="formModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Product Detail</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form action="
      " id = "FromTable">
      <div class="modal-body">
           <div class="form-floating mb-3">
  <input type="text" class="form-control" id="productName" name="productName" required placeholder="name@example.com">
  <label for="floatingInput">Product name</label>
</div>
<div class="form-floating">
  <input type="text" class="form-control" required id="productPrice" name="productPrice" placeholder="Password">
  <label for="floatingPassword">Product price</label>
</div>
<div class="form-floating"> 
  <input type="text" class="form-control" required id="productImage" name="productImage" placeholder="Password">
  <label for="floatingPassword">Product image</label>
</div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary" >Product Added</button>
      </div>
      </form>
    </div>
  </div>
</div>


<div class="modal" id="UpdateCartModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Modal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
          <form action="
      " id = "UpdateModal">
      <div class="modal-body">
           <div class="form-floating mb-3">
  <input type="text" class="form-control" id="updataProductName" name="updataProductName" required placeholder="name@example.com">
  <label for="floatingInput">Product name</label>
</div>
<div class="form-floating">
  <input type="text" class="form-control" required id="updataProductPrice" name="updataProductPrice" placeholder="Password">
  <label for="floatingPassword">Product price</label>
</div>
<div class="form-floating"> 
  <input type="text" class="form-control" required id="updataProductImage" name="updataProductImage" placeholder="Password">
  <label for="floatingPassword">Product image</label>
</div>
      </div>
   
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary">Update Product</button>
      </div>
         </form>
    </div>
  </div>
</div>



      </main>

<script 
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<script src="./script.js"></script>
    </body>
  </html>
